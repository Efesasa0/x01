name: koopman

#  Transformer (Table S2)
dims: 16
num_blocks: [4, 6, 6, 8]
num_heads: [1, 2, 4, 8]
dynamics_mode: separate  # separate | single
dynamics_rank: null  # null = full 512x512 K; int in (0, 512) enables low-rank K = up(down(x) @ core)
pixel_rollout_steps: 1  # Azencot
latent_rollout_steps: 0  # Lusch
lambda_fwd: 1.0
lambda_recon: 1.0
lambda_consist: 0.1
lambda_bwd: 0.1 # Azencot
lambda_latent_fwd: 0.0 # Lusch
lambda_latent_bwd: 0.0 # Lusch
lambda_ortho_a: 0.0
lambda_ortho_b: 0.0
lambda_consist_progressive: 0.0 # Azencot
loss_mode: lp # lp | hs | mse
lp_size_average: true
hs_size_average: false
mse_size_average: false 
