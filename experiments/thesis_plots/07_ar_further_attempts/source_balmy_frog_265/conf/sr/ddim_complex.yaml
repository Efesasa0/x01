name: ddim

# Table S1's [1,1,1,2]) so the down stack reaches 16x16 and attention_resolutions=[16] fires.
in_channels: 1
out_channels: 1
latent_dims: 64
channel_multipliers: [1, 1, 1, 1, 2]
num_res_blocks: 1
attention_resolutions: [16]
image_resolution: 256
dropout_rate: 0.0
resample_with_conv: true

# HR (256x256) -> stride-subsample by factor -> LR (64x64) -> nearest upsample -> condition (256x256)
condition_downsample_factor: 4

# DDIM schedule (DDPM defaults)
beta_start: 1.0e-4
beta_end: 2.0e-2
num_diffusion_time_steps: 1000
condition_dropout_rate: 0.0  # classifier-free-guidance dropout (training only)

# Sampling
inference_steps: 40
